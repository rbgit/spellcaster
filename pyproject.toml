[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "claude-codex-planner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dbos>=2.19.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
claude-codex-planner = "claude_codex_planner.app:cli"

[tool.setuptools.packages.find]
include = ["claude_codex_planner*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
